<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>LabFlow Nexus | Laboratory Workflow System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a192f 0%, #0f172a 100%);
    color: #e2e8f0;
    overflow-x: hidden;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 280px;
    height: 100vh;
    background: rgba(10, 25, 47, 0.95);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    z-index: 1000;
    transition: all 0.3s;
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.logo img {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    padding: 8px;
}

.logo-title {
    font-size: 1.4rem;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #94a3f8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.2;
}

.logo-sub {
    font-size: 0.7rem;
    color: #6c86a3;
    letter-spacing: 0.5px;
}

.sidebar nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.sidebar nav a {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    color: #cbd5e6;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s;
    font-size: 0.9rem;
}

.sidebar nav a i, .sidebar nav a .bi {
    font-size: 1.2rem;
    width: 24px;
}

.sidebar nav a:hover {
    background: rgba(34, 197, 94, 0.15);
    color: #22c55e;
    transform: translateX(5px);
}

.sidebar nav a.active {
    background: linear-gradient(95deg, rgba(34, 197, 94, 0.2), rgba(22, 163, 74, 0.1));
    color: #22c55e;
    border-left: 3px solid #22c55e;
}

.sidebar-footer {
    padding-top: 1.5rem;
    margin-top: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-footer a {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    color: #ef4444;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s;
}

.sidebar-footer a:hover {
    background: rgba(239, 68, 68, 0.15);
    transform: translateX(5px);
}

.topbar {
    position: fixed;
    top: 0;
    right: 0;
    left: 280px;
    height: 70px;
    background: rgba(15, 25, 45, 0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    z-index: 999;
}

.page-title {
    font-size: 1.3rem;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff, #94a3f8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.avatar {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    color: white;
}

.role-badge {
    background: rgba(34, 197, 94, 0.2);
    padding: 0.3rem 1rem;
    border-radius: 2rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: #22c55e;
    border: 1px solid rgba(34, 197, 94, 0.3);
}

.main-content {
    margin-left: 280px;
    margin-top: 70px;
    padding: 2rem;
    min-height: calc(100vh - 70px);
}

#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 25, 47, 0.9);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    visibility: hidden;
    opacity: 0;
    transition: 0.2s;
}

#loader.active {
    visibility: visible;
    opacity: 1;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(34, 197, 94, 0.3);
    border-top-color: #22c55e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.container.public {
    margin-left: 0;
    margin-top: 0;
    padding: 2rem;
}

@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
    }
    .topbar {
        left: 0;
    }
    .main-content {
        margin-left: 0;
    }
}

::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: #0f172a;
}
::-webkit-scrollbar-thumb {
    background: #22c55e;
    border-radius: 10px;
}
</style>

</head>
<body>

<div id="loader">
    <div class="spinner"></div>
</div>

<script>
    const currentRole = sessionStorage.getItem('user_role');
    
    if (currentRole) {
        document.write(`
            <div class="sidebar">
                <div class="logo">
                    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966480.png" alt="Logo">
                    <div>
                        <div class="logo-title">LabFlow</div>
                        <small class="logo-sub">Lab System</small>
                    </div>
                </div>
                
                <nav>
                    <a href="dashboard.html" id="navDashboard">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
        `);
        
        if (currentRole === "Receptionist") {
            document.write(`
                <a href="receptionist_add_patient.html" id="navAddPatient">
                    <i class="bi bi-person-plus"></i>
                    <span>Add Patient</span>
                </a>
                <a href="receptionist_add_sample.html" id="navAddSample">
                    <i class="bi bi-droplet-half"></i>
                    <span>Add Sample</span>
                </a>
            `);
        }
        
        if (currentRole === "Technician") {
            document.write(`
                <a href="technician_view_tests.html" id="navViewTests">
                    <i class="bi bi-clipboard-data"></i>
                    <span>View Tests</span>
                </a>
            `);
        }
        
        if (currentRole === "Doctor") {
            document.write(`
                <a href="doctor_view_reports.html" id="navViewReports">
                    <i class="bi bi-file-earmark-medical"></i>
                    <span>View Reports</span>
                </a>
            `);
        }
        
        document.write(`
                </nav>
                
                <div class="sidebar-footer">
                    <a href="logout.html">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
            
            <div class="topbar">
                <div class="page-title">
                    Laboratory Workflow System
                </div>
                <div class="user-info">
                    <div class="avatar">
                        ${currentRole.charAt(0).toUpperCase()}
                    </div>
                    <span class="role-badge">
                        ${currentRole}
                    </span>
                </div>
            </div>
            
            <div class="main-content">
        `);
        
        const currentPage = window.location.pathname.split('/').pop();
        const navMap = {
            'dashboard.html': 'navDashboard',
            'receptionist_add_patient.html': 'navAddPatient',
            'receptionist_add_sample.html': 'navAddSample',
            'technician_view_tests.html': 'navViewTests',
            'doctor_view_reports.html': 'navViewReports'
        };
        
        if (navMap[currentPage]) {
            const activeLink = document.getElementById(navMap[currentPage]);
            if (activeLink) activeLink.classList.add('active');
        }
    } else {
        document.write('<div class="container public mt-5">');
    }
    
    function showLoader() {
        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('active');
    }
    
    function hideLoader() {
        const loader = document.getElementById('loader');
        if (loader) loader.classList.remove('active');
    }
    
    window.addEventListener('beforeunload', function() {
        showLoader();
    });
</script>

</body>
</html>
