<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LabFlow Nexus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0a0f1f,#0f172a);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1rem;
}
.card{
    background:rgba(15,23,42,0.95);
    backdrop-filter:blur(10px);
    border-radius:1.5rem;
    padding:2rem;
    width:100%;
    max-width:480px;
    border:1px solid rgba(34,197,94,0.3);
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}
.logo{text-align:center;margin-bottom:1.5rem;}
.logo i{font-size:2.8rem;color:#22c55e;}
.logo h1{font-size:1.6rem;font-weight:700;color:#fff;margin-top:0.5rem;}
.logo p{color:#94a3b8;font-size:0.85rem;}
.input-group{
    margin-bottom:1rem;
}
.input-group input{
    width:100%;
    padding:0.75rem 2.5rem 0.75rem 2.5rem;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:0.8rem;
    color:#fff;
    outline:none;
    font-size:0.9rem;
}
.input-group input:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 2px rgba(34,197,94,0.2);
}
.input-group input::placeholder{
    color:#64748b;
}
.input-wrapper{
    position:relative;
    width:100%;
}
.input-wrapper i:first-child{
    position:absolute;
    left:0.8rem;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
    font-size:0.9rem;
    z-index:2;
}
.password-toggle{
    position:absolute;
    right:0.8rem;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
    font-size:0.9rem;
    cursor:pointer;
    transition:0.2s;
    z-index:2;
}
.password-toggle:hover{color:#22c55e;}
.btn{
    width:100%;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    border:none;
    padding:0.75rem;
    border-radius:0.8rem;
    font-weight:600;
    color:#fff;
    transition:0.2s;
    font-size:0.95rem;
    cursor:pointer;
}
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(34,197,94,0.4);
}
.links{
    display:flex;
    justify-content:space-between;
    margin:1.2rem 0;
}
.links a{
    color:#ffffff !important;
    text-decoration:none;
    font-size:0.8rem;
    cursor:pointer;
    transition:0.2s;
}
.links a:hover{color:#22c55e;}
.back{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    background:rgba(255,255,255,0.05);
    border:1px solid #334155;
    padding:0.7rem;
    border-radius:0.8rem;
    color:#cbd5e6;
    text-decoration:none;
    font-size:0.85rem;
    margin-top:1rem;
    transition:0.2s;
}
.back:hover{
    background:rgba(34,197,94,0.1);
    border-color:#22c55e;
    color:#22c55e;
}
.error{
    background:rgba(220,38,38,0.15);
    border:1px solid #ef4444;
    border-radius:0.8rem;
    padding:0.6rem;
    color:#fecaca;
    font-size:0.8rem;
    margin-bottom:1rem;
    text-align:center;
    display:none;
}
.demo{
    margin-top:1.5rem;
    padding-top:1rem;
    border-top:1px solid #334155;
    text-align:center;
}
.demo small{
    color:#64748b;
    font-size:0.7rem;
    display:block;
    margin-bottom:0.5rem;
}
.badges{
    display:flex;
    gap:0.5rem;
    justify-content:center;
    flex-wrap:wrap;
}
.badge{
    background:rgba(34,197,94,0.12);
    padding:0.3rem 0.7rem;
    border-radius:1rem;
    font-size:0.65rem;
    color:#86efac;
    font-family:monospace;
}
.modal-content{
    background:#0f172a;
    border:1px solid #22c55e;
    border-radius:1rem;
    color:#fff;
}
.modal-header{border-bottom-color:#334155;}
.modal-footer{border-top-color:#334155;}
.modal .btn-close{filter:invert(1);background:rgba(255,255,255,0.2);border-radius:50%;}
.modal input{
    background:#1e293b;
    border:1px solid #334155;
    color:#ffffff;
    border-radius:0.6rem;
    padding:0.6rem;
    width:100%;
}
.modal input::placeholder{
    color:#86efac;
    font-size:0.75rem;
    opacity:0.8;
}
.modal input:focus::placeholder{
    opacity:0.5;
}
.modal .btn-secondary{
    background:#334155;
    border:none;
    color:#fff;
}
.modal .btn-secondary:hover{
    background:#475569;
}
.modal .btn-success{
    background:#22c55e;
    border:none;
}
.modal .btn-success:hover{
    background:#16a34a;
}
@media(max-width:500px){
    .card{padding:1.5rem;max-width:95%;}
    .links{flex-direction:column;gap:0.7rem;text-align:center;}
}
</style>
</head>
<body>

<div class="card">
    <div class="logo">
        <i class="fas fa-flask"></i>
        <h1>LabFlow Nexus</h1>
        <p>Access your laboratory dashboard</p>
    </div>

    <div id="errorMsg" class="error"></div>

    <form id="loginForm">
        <div class="input-group">
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" name="username" id="username" placeholder="Username" required>
            </div>
        </div>
        <div class="input-group">
            <div class="input-wrapper">
                <i class="fas fa-key"></i>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
            </div>
        </div>

        <div class="links">
            <a data-bs-toggle="modal" data-bs-target="#forgotModal"><i class="fas fa-question-circle"></i> Forgot Password?</a>
            <a data-bs-toggle="modal" data-bs-target="#registerModal"><i class="fas fa-user-plus"></i> Create Account</a>
        </div>

        <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>

    <a href="/" class="back"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div class="demo">
        <small><i class="fas fa-info-circle"></i> Demo Credentials</small>
        <div class="badges">
            <span class="badge">👨‍⚕️ Doctor: rishav.doc / doc123</span>
            <span class="badge">🔬 Technician: rohit.tech / pass123</span>
            <span class="badge">📋 Receptionist: yogita.reception / reception123</span>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-key me-2" style="color:#22c55e;"></i> Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="forgotError" class="alert alert-danger" style="display:none;font-size:0.75rem;"></div>
                <div id="forgotSuccess" class="alert alert-success" style="display:none;font-size:0.75rem;"></div>
                <input type="text" id="resetUser" class="form-control mb-2" placeholder="Username">
                <input type="text" id="resetName" class="form-control mb-2" placeholder="Full Name">
                <input type="password" id="resetPass" class="form-control mb-2" placeholder="New Password">
                <input type="password" id="resetConfirm" class="form-control" placeholder="Confirm Password">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="resetPassword()">Reset Password</button>
            </div>
        </div>
    </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus me-2" style="color:#22c55e;"></i> Create Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="regError" class="alert alert-danger" style="display:none;font-size:0.75rem;"></div>
                <div id="regSuccess" class="alert alert-success" style="display:none;font-size:0.75rem;"></div>
                <input type="text" id="regName" class="form-control mb-2" placeholder="Full Name">
                <input type="text" id="regUser" class="form-control mb-2" placeholder="Username">
                <input type="password" id="regPass" class="form-control mb-2" placeholder="Password">
                <input type="password" id="regConfirm" class="form-control mb-2" placeholder="Confirm Password">
                <select id="regRole" class="form-control">
                    <option value="Technician">🔬 Technician</option>
                    <option value="Doctor">👨‍⚕️ Doctor</option>
                    <option value="Receptionist">📋 Receptionist</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="registerUser()">Register Account</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Show/Hide Password Toggle
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');

togglePassword.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.classList.toggle('fa-eye');
    this.classList.toggle('fa-eye-slash');
});

const form = document.getElementById('loginForm');
const errorDiv = document.getElementById('errorMsg');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.style.display = 'none';
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
        errorDiv.innerText = 'Please enter both username and password';
        errorDiv.style.display = 'block';
        return;
    }

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.success) {
            sessionStorage.setItem('user_role', data.role);
            sessionStorage.setItem('user_id', data.user_id);
            sessionStorage.setItem('username', data.username);
            window.location.href = 'dashboard.html';
        } else {
            errorDiv.innerText = data.error;
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        errorDiv.innerText = 'Server error. Make sure server is running on port 3000';
        errorDiv.style.display = 'block';
    }
});

async function resetPassword() {
    const user = document.getElementById('resetUser').value.trim();
    const name = document.getElementById('resetName').value.trim();
    const pass = document.getElementById('resetPass').value;
    const confirm = document.getElementById('resetConfirm').value;
    const errDiv = document.getElementById('forgotError');
    const sucDiv = document.getElementById('forgotSuccess');
    
    errDiv.style.display = 'none';
    sucDiv.style.display = 'none';
    
    if (!user || !name || !pass || !confirm) {
        errDiv.innerText = 'Please fill all fields';
        errDiv.style.display = 'block';
        return;
    }
    if (pass !== confirm) {
        errDiv.innerText = 'Passwords do not match';
        errDiv.style.display = 'block';
        return;
    }
    if (pass.length < 4) {
        errDiv.innerText = 'Password must be at least 4 characters';
        errDiv.style.display = 'block';
        return;
    }
    
    try {
        const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, full_name: name, new_password: pass })
        });
        const data = await res.json();
        
        if (data.success) {
            sucDiv.innerText = data.message;
            sucDiv.style.display = 'block';
            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('forgotModal')).hide();
                document.getElementById('resetUser').value = '';
                document.getElementById('resetName').value = '';
                document.getElementById('resetPass').value = '';
                document.getElementById('resetConfirm').value = '';
            }, 1500);
        } else {
            errDiv.innerText = data.error;
            errDiv.style.display = 'block';
        }
    } catch (err) {
        errDiv.innerText = 'Connection error. Please try again.';
        errDiv.style.display = 'block';
    }
}

async function registerUser() {
    const name = document.getElementById('regName').value.trim();
    const user = document.getElementById('regUser').value.trim();
    const pass = document.getElementById('regPass').value;
    const confirm = document.getElementById('regConfirm').value;
    const role = document.getElementById('regRole').value;
    const errDiv = document.getElementById('regError');
    const sucDiv = document.getElementById('regSuccess');
    
    errDiv.style.display = 'none';
    sucDiv.style.display = 'none';
    
    if (!name || !user || !pass || !confirm) {
        errDiv.innerText = 'Please fill all fields';
        errDiv.style.display = 'block';
        return;
    }
    if (pass !== confirm) {
        errDiv.innerText = 'Passwords do not match';
        errDiv.style.display = 'block';
        return;
    }
    if (pass.length < 4) {
        errDiv.innerText = 'Password must be at least 4 characters';
        errDiv.style.display = 'block';
        return;
    }
    
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: name, username: user, password: pass, role: role })
        });
        const data = await res.json();
        
        if (data.success) {
            sucDiv.innerText = data.message;
            sucDiv.style.display = 'block';
            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                document.getElementById('regName').value = '';
                document.getElementById('regUser').value = '';
                document.getElementById('regPass').value = '';
                document.getElementById('regConfirm').value = '';
            }, 1500);
        } else {
            errDiv.innerText = data.error;
            errDiv.style.display = 'block';
        }
    } catch (err) {
        errDiv.innerText = 'Connection error. Please try again.';
        errDiv.style.display = 'block';
    }
}
</script>
</body>
</html>
