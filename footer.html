<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>LabFlow Nexus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a192f 0%, #0f172a 100%);
    color: #e2e8f0;
    overflow-x: hidden;
}

.toast-msg {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: linear-gradient(135deg, #1a3a2e, #0f2a1f);
    backdrop-filter: blur(20px);
    color: #4ade80;
    padding: 1rem 1.8rem;
    border-radius: 1rem;
    font-weight: 500;
    font-size: 0.9rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(74, 222, 128, 0.3);
    z-index: 3000;
    transform: translateX(120%);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.toast-msg.show {
    transform: translateX(0);
}

.toast-msg::before {
    content: "✓";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    background: #22c55e;
    border-radius: 50%;
    color: #0a192f;
    font-size: 0.8rem;
    font-weight: bold;
}

@media (max-width: 768px) {
    .toast-msg {
        bottom: 1rem;
        right: 1rem;
        left: 1rem;
        transform: translateY(120%);
        text-align: center;
        justify-content: center;
    }
    .toast-msg.show {
        transform: translateY(0);
    }
}

.loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 25, 47, 0.95);
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.3s;
}

.loader-spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(34, 197, 94, 0.2);
    border-top: 4px solid #22c55e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div id="loaderOverlay" class="loader-overlay" style="display: flex;">
    <div class="loader-spinner"></div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    window.addEventListener("load", function(){
        const loader = document.getElementById("loaderOverlay");
        if(loader){
            setTimeout(() => {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 300);
            }, 400);
        }
    });

    setTimeout(() => {
        const loader = document.getElementById("loaderOverlay");
        if(loader && loader.style.display !== "none"){
            loader.style.opacity = "0";
            setTimeout(() => {
                loader.style.display = "none";
            }, 300);
        }
    }, 2500);

    function showToast(message, isError = false) {
        const toast = document.getElementById("toastMsg");
        if (!toast) return;
        
        toast.innerText = message;
        
        if (isError) {
            toast.style.background = "linear-gradient(135deg, #3a1a1a, #2a0f0f)";
            toast.style.borderColor = "rgba(239, 68, 68, 0.3)";
            toast.style.color = "#f87171";
            toast.style.setProperty('--before-content', '"⚠"');
        } else {
            toast.style.background = "linear-gradient(135deg, #1a3a2e, #0f2a1f)";
            toast.style.borderColor = "rgba(74, 222, 128, 0.3)";
            toast.style.color = "#4ade80";
        }
        
        toast.classList.add("show");
        
        setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }
</script>

</body>
</html>
