<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Tests | LabFlow Nexus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0f1f,#0f172a);color:#fff;}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:rgba(10,25,47,0.95);backdrop-filter:blur(12px);padding:1.5rem;border-right:1px solid rgba(34,197,94,0.2);}
.logo-title{font-size:1.2rem;font-weight:700;color:#fff;}
.logo-sub{font-size:0.65rem;color:#94a3b8;}
.sidebar nav a{display:flex;align-items:center;gap:0.7rem;padding:0.7rem 1rem;color:#cbd5e6;text-decoration:none;border-radius:0.8rem;margin-bottom:0.3rem;transition:all 0.3s;}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(34,197,94,0.15);color:#22c55e;transform:translateX(5px);}
.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.1);}
.sidebar-footer a{display:flex;align-items:center;gap:0.7rem;color:#ef4444;text-decoration:none;padding:0.7rem 1rem;transition:0.3s;}
.sidebar-footer a:hover{background:rgba(239,68,68,0.15);transform:translateX(5px);}

/* Topbar */
.topbar{margin-left:250px;height:60px;background:rgba(15,25,45,0.8);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;border-bottom:1px solid rgba(34,197,94,0.2);}
.page-title{font-size:1.2rem;font-weight:600;color:#fff;}
.user-info{display:flex;align-items:center;gap:0.8rem;}
.avatar{width:35px;height:35px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;transition:0.3s;}
.avatar:hover{transform:scale(1.1);}
.role-badge{background:rgba(34,197,94,0.2);padding:0.3rem 0.8rem;border-radius:2rem;font-size:0.75rem;color:#22c55e;}

/* Main Content */
.main-content{margin-left:250px;padding:1.5rem;animation:fadeIn 0.5s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* Card */
.card{background:rgba(15,25,45,0.5);border-radius:1rem;border:1px solid rgba(255,255,255,0.08);padding:1.5rem;backdrop-filter:blur(10px);}

/* Search Bar */
.search-bar{background:rgba(10,25,47,0.6);border-radius:0.8rem;padding:0.5rem;margin-bottom:1.5rem;display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;}
.search-input{flex:2;min-width:200px;}
.filter-input{flex:1;min-width:150px;}
.search-bar input,.search-bar select{background:#1e293b;border:1px solid #475569;color:#fff;border-radius:0.6rem;padding:0.6rem 1rem;width:100%;}
.search-bar input:focus,.search-bar select:focus{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,0.2);outline:none;}
.search-bar input::placeholder{color:#64748b;}
.btn-search{background:#22c55e;border:none;color:#fff;padding:0.6rem 1.2rem;border-radius:0.6rem;cursor:pointer;transition:0.3s;}
.btn-search:hover{background:#16a34a;transform:translateY(-2px);}
.btn-reset{background:#334155;border:none;color:#fff;padding:0.6rem 1.2rem;border-radius:0.6rem;cursor:pointer;transition:0.3s;}
.btn-reset:hover{background:#475569;transform:translateY(-2px);}
.stats-badge{background:rgba(34,197,94,0.15);padding:0.3rem 0.8rem;border-radius:2rem;font-size:0.75rem;color:#4ade80;}

/* Table */
.table-responsive{overflow-x:auto;}
.table{color:#e2e8f0;margin-bottom:0;border-collapse:separate;border-spacing:0;}
.table thead th{background:rgba(0,0,0,0.4);border-bottom:2px solid rgba(34,197,94,0.3);color:#cbd5e6;padding:1rem 0.8rem;font-weight:600;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;}
.table tbody td{background:rgba(10,25,47,0.4);border-bottom:1px solid rgba(255,255,255,0.05);padding:0.8rem;vertical-align:middle;transition:all 0.3s;}
.table tbody tr:hover td{background:rgba(34,197,94,0.08);transform:scale(1.01);}
.table tbody tr{animation:rowFade 0.3s ease;}
@keyframes rowFade{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}

.badge-pending{background:#f59e0b;color:#fff;padding:0.3rem 0.8rem;border-radius:2rem;font-size:0.7rem;font-weight:600;}
.badge-completed{background:#22c55e;color:#fff;padding:0.3rem 0.8rem;border-radius:2rem;font-size:0.7rem;font-weight:600;}
.btn-sm{padding:0.4rem 1rem;border-radius:0.5rem;font-size:0.75rem;font-weight:600;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;color:#fff;text-decoration:none;display:inline-block;transition:all 0.3s;}
.btn-sm:hover{background:linear-gradient(135deg,#2563eb,#1d4ed8);transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4);}
.text-muted{color:#6c86a3 !important;}
.loader-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,25,47,0.95);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loader-spinner{width:50px;height:50px;border:4px solid rgba(34,197,94,0.2);border-top-color:#22c55e;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-msg{position:fixed;bottom:1.5rem;right:1.5rem;background:#1a3a2e;color:#4ade80;padding:0.7rem 1.2rem;border-radius:0.8rem;z-index:3000;transform:translateX(120%);transition:0.3s;box-shadow:0 5px 15px rgba(0,0,0,0.3);}
.toast-msg.show{transform:translateX(0);}
.empty-state{text-align:center;padding:2rem;color:#6c86a3;}
@media(max-width:768px){.sidebar{transform:translateX(-100%);}.topbar,.main-content{margin-left:0;}.search-bar{flex-direction:column;}}
</style>
</head>
<body>

<div id="loaderOverlay" class="loader-overlay"><div class="loader-spinner"></div></div>

<div class="sidebar">
    <div class="logo"><div><div class="logo-title">LabFlow Nexus</div><div class="logo-sub">Lab System</div></div></div>
    <nav>
        <a href="../dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a href="view_tests.html" class="active"><i class="bi bi-clipboard-data"></i><span>View Tests</span></a>
    </nav>
    <div class="sidebar-footer"><a href="../logout.html"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></div>
</div>

<div class="topbar">
    <div class="page-title"><i class="bi bi-clipboard-data me-2" style="color:#22c55e;"></i>Laboratory Workflow System</div>
    <div class="user-info"><div class="avatar" id="userAvatar">T</div><span class="role-badge" id="userRole">Technician</span></div>
</div>

<div class="main-content">
    <h3 class="fw-bold mb-3"><i class="bi bi-flask me-2" style="color:#22c55e;"></i>Lab Test Dashboard</h3>
    
    <!-- Search and Filter Section -->
    <div class="search-bar">
        <div class="search-input">
            <input type="text" id="searchInput" placeholder="🔍 Search by patient name or test..." class="form-control">
        </div>
        <div class="filter-input">
            <select id="statusFilter" class="form-select">
                <option value="all">📊 All Status</option>
                <option value="pending">⏳ Pending</option>
                <option value="completed">✅ Completed</option>
            </select>
        </div>
        <button class="btn-search" onclick="applyFilters()"><i class="bi bi-search me-1"></i> Search</button>
        <button class="btn-reset" onclick="resetFilters()"><i class="bi bi-arrow-repeat me-1"></i> Reset</button>
    </div>

    <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="stats-badge"><i class="bi bi-bar-chart me-1"></i> Total Tests: <span id="totalCount">0</span></span>
            <button onclick="loadTests()" class="btn-refresh" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#4ade80;border-radius:2rem;padding:0.3rem 1rem;font-size:0.8rem;cursor:pointer;"><i class="bi bi-arrow-repeat me-1"></i> Refresh</button>
        </div>
        <div class="table-responsive">
            <table class="table">
                <thead><tr><th>ID</th><th>Patient</th><th>Test</th><th>Result</th><th>Status</th><th>Performed</th><th>Action</th></tr></thead>
                <tbody id="testsTableBody"><tr><td colspan="7" class="empty-state"><i class="bi bi-hourglass-split me-2"></i>Loading tests...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
let allTests = [];

const role=sessionStorage.getItem('user_role');
if(!role||role!=='Technician') window.location.href='../login.html';
document.getElementById('userAvatar').innerText='T';
document.getElementById('userRole').innerText='Technician';

function showToast(msg,isErr=false){
    const t=document.getElementById('toastMsg');
    t.innerText=msg;
    t.style.background=isErr?'#3a1a1a':'#1a3a2e';
    t.style.color=isErr?'#f87171':'#4ade80';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3000);
}

async function loadTests(){
    const loader=document.getElementById('loaderOverlay');
    loader.style.display='flex';
    try{
        const res=await fetch('/api/tests');
        const data=await res.json();
        if(data.success){
            allTests=data.tests||[];
            applyFilters();
        }else showToast('Failed to load tests',true);
    }catch(e){showToast('Connection error',true);}
    finally{setTimeout(()=>loader.style.display='none',500);}
}

function applyFilters(){
    const searchTerm=document.getElementById('searchInput').value.toLowerCase();
    const statusFilter=document.getElementById('statusFilter').value;
    
    let filtered=allTests.filter(test=>{
        const matchSearch=test.patient_name?.toLowerCase().includes(searchTerm)||test.test_name?.toLowerCase().includes(searchTerm);
        let matchStatus=true;
        if(statusFilter==='pending') matchStatus=!test.result_value||test.result_value==='';
        if(statusFilter==='completed') matchStatus=test.result_value&&test.result_value!=='';
        return matchSearch&&matchStatus;
    });
    
    document.getElementById('totalCount').innerText=filtered.length;
    renderTable(filtered);
}

function resetFilters(){
    document.getElementById('searchInput').value='';
    document.getElementById('statusFilter').value='all';
    applyFilters();
}

function renderTable(tests){
    const tbody=document.getElementById('testsTableBody');
    tbody.innerHTML='';
    if(!tests||tests.length===0){
        tbody.innerHTML='<tr><td colspan="7" class="empty-state"><i class="bi bi-inbox me-2"></i>No tests available</td></tr>';
        return;
    }
    tests.forEach((t,index)=>{
        const completed=t.result_value&&t.result_value!=='';
        tbody.innerHTML+=`<tr style="animation-delay:${index*0.05}s">
            <td><span style="background:#334155;color:#fff;padding:0.2rem 0.6rem;border-radius:0.5rem;">#${t.sample_test_id}</span></td>
            <td><strong><i class="bi bi-person-circle me-1" style="color:#22c55e;"></i>${t.patient_name||'Unknown'}</strong></td>
            <td><i class="bi bi-microscope me-1" style="color:#f59e0b;"></i>${t.test_name||'Unknown'}</td>
            <td>${t.result_value||'<span class="text-muted">—</span>'}</td>
            <td>${completed?'<span class="badge-completed"><i class="bi bi-check-circle me-1"></i>Completed</span>':'<span class="badge-pending"><i class="bi bi-clock me-1"></i>Pending</span>'}</td>
            <td>${t.performed_at?new Date(t.performed_at).toLocaleDateString():'<span class="text-muted">Not performed</span>'}</td>
            <td>${!completed?`<a href="update_test.html?id=${t.sample_test_id}" class="btn-sm"><i class="bi bi-pencil-square me-1"></i>Update</a>`:'<span class="text-muted"><i class="bi bi-check2-all me-1"></i>Done</span>'}</td>
        </tr>`;
    });
}

window.onload=()=>{loadTests();setTimeout(()=>{const l=document.getElementById('loaderOverlay');if(l)l.style.display='none';},500);};
</script>
</body>
</html>
